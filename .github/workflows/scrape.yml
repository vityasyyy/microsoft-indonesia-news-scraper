name: scrape
# WHEN THIS RUNS (explicit — change with care):
# Manual only: Actions tab -> "scrape" -> "Run workflow" (anytime, any reason).
# No schedule, no push/PR triggers: runs happen on demand so each Release is
# intentional. Re-add a cron under `on:` if periodic runs are ever wanted.
on:
  workflow_dispatch: {} # manual button
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run python -m src.scrape
      - uses: actions/upload-artifact@v4
        with:
          name: articles-2025
          path: output/
      - name: Release xlsx
        uses: softprops/action-gh-release@v2
        with:
          tag_name: articles-2025-${{ github.run_number }}
          files: output/articles-2025.xlsx
