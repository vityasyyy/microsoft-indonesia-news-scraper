name: scrape
# WHEN THIS RUNS (explicit — change with care):
# 1. Manual: Actions tab -> "scrape" -> "Run workflow" (anytime, any reason).
# 2. Weekly: every Monday 01:00 UTC (= 08:00 WIB) via cron below.
# NOT on push/PR: scraping on every code change would spam Releases and
# hammer Google News RSS rate limits. Docs-only changes never trigger a run.
on:
  workflow_dispatch: {} # manual button
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC / 08:00 WIB
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run python -m src.scrape
      - uses: actions/upload-artifact@v4
        with:
          name: articles-2025
          path: output/
      - name: Release xlsx
        uses: softprops/action-gh-release@v2
        with:
          tag_name: articles-2025-${{ github.run_number }}
          files: output/articles-2025.xlsx
